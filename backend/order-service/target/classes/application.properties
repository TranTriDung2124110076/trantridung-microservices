spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/delivery_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

customer.service.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8083}
customer.service.connect-timeout-ms=${CUSTOMER_SERVICE_CONNECT_TIMEOUT_MS:2000}
customer.service.read-timeout-ms=${CUSTOMER_SERVICE_READ_TIMEOUT_MS:3000}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true